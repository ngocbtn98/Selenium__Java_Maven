# ===== BT11: Config hệ thống eCommerce =====
# Browser: chrome | firefox | edge  (suite XML có parameter browser sẽ override)
browser=chrome
headless=false
# Đường dẫn Chrome tuỳ chọn, để trống = dùng Chrome mặc định trên máy
chrome_binary=
url=https://cms.anhtester.com/login
email=admin@example.com
password=123456

explicit_wait=15
page_load_timeout=40

# Excel data test (BT10)
excel_data_file=src/test/resources/testdata/DataTest.xlsx

# Tên hình đã upload sẵn bằng tay trên website để chọn khi Add Category/Brand
image_name=anhtester

# Screenshot & Video (BT12)
screenshot_path=exports/screenshots
screenshot_all_step=false
screenshot_fail=true
video_record=false
video_path=exports/videos

# Extent Report (BT15)
extent_report_path=exports/ExtentReport/ExtentReport.html
