# ===== BÀI TẬP 11: Config chung cho hệ thống eCommerce CMS =====
# Có thể ghi đè khi chạy Maven, ví dụ: mvn clean test -Dbrowser=edge -Dheadless=true

# Browser (BT8): chrome | edge | firefox
browser=chrome
headless=false

# Website
url=https://cms.anhtester.com/admin
url.login=https://cms.anhtester.com/login
email=admin@example.com
password=123456

# Timeout (giây) - BT7: chỉ dùng Explicit wait
explicit.wait=15
page.load.timeout=40

# Excel test data (BT10) - file tự tạo lần đầu chạy nếu chưa có
excel.data.path=src/test/resources/testdata/TestData.xlsx

# Screenshot + Video (BT12)
screenshot.path=exports/screenshots
screenshot.all.pages=true
screenshot.fail=true
video.record=false
video.path=exports/videos

# Report (BT15)
extent.report.path=exports/ExtentReport/ExtentReport.html
author=ngocbtn
