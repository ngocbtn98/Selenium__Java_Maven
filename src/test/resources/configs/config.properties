# ===== BÀI TẬP 11: Config chung cho hệ thống eCommerce CMS =====
# Có thể ghi đè khi chạy Maven, ví dụ: mvn clean test -Dbrowser=edge -Dheadless=true

# Browser (BT8): chrome | edge | firefox
browser=chrome
headless=false

# Website
url=https://cms.anhtester.com/admin
url.login=https://cms.anhtester.com/login
email=admin@example.com
password=123456

# Timeout (giây) - BT7: chỉ dùng Explicit wait
explicit.wait=15
page.load.timeout=40

# Excel test data (BT10) - file tự tạo lần đầu chạy nếu chưa có
excel.data.path=src/test/resources/testdata/TestData.xlsx

# Screenshot + Video (BT12)
screenshot.path=exports/screenshots
screenshot.all.pages=true
screenshot.fail=true
video.record=false
video.path=exports/videos

# Report (BT15)
extent.report.path=exports/ExtentReport/ExtentReport.html
author=ngocbtn

# ===== Mobile Android (AOS) - Appium =====
# Chạy: mvn clean test -DsuiteXmlFile=suites/AndroidApp.xml
# Ghi đè: -Dappium.server.url=http://127.0.0.1:4723 -Dandroid.udid=emulator-5554
appium.server.url=http://127.0.0.1:4723
android.platform.version=
android.device.name=Android Emulator
android.udid=
# App demo: ApiDemos (https://github.com/appium/android-apidemos/releases)
# Có android.app (đường dẫn .apk) thì cài app; để trống thì mở app đã cài theo package/activity
android.app=src/test/resources/apps/ApiDemos-debug.apk
android.app.package=io.appium.android.apis
android.app.activity=io.appium.android.apis.ApiDemos
android.no.reset=false
android.auto.grant.permissions=true
android.new.command.timeout=120
mobile.explicit.wait=20
